; PlatformIO Project Configuration File
;
; Firmware for a DFRobot FireBeetle 2 ESP32-C6 that polls a JK BMS over its
; TTL "GPS" UART and shows the data on a 240x240 ST7789 TFT (default
; environment) or a 2.42" SSD1309 OLED (the _oled environment).
; Firmware options live in menuconfig:  pio run [-e <env>] -t menuconfig
; See README.md for wiring and usage.

[platformio]
default_envs = dfrobot_firebeetle2_esp32c6

[env:dfrobot_firebeetle2_esp32c6]
platform = espressif32@7.1.3
; Local board definition in boards/ (the platform does not ship this board)
board = dfrobot_firebeetle2_esp32c6
framework = espidf
board_build.partitions = partitions_singleapp_large.csv
monitor_speed = 115200
; Host-only tests; see [env:native]
test_ignore = test_jk_proto

; 2.42" SSD1309 I2C OLED, 128x64 used as 64x128 portrait. Same firmware with the
; OLED backend: sdkconfig.defaults.oled is layered on top of sdkconfig.defaults.
;   pio run -e dfrobot_firebeetle2_esp32c6_oled -t upload
[env:dfrobot_firebeetle2_esp32c6_oled]
extends = env:dfrobot_firebeetle2_esp32c6
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.oled

; Host unit tests for the pure-C protocol module:  pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<jk_proto.c>
build_flags = -std=gnu2x -Wall -Wextra -Werror -Wimplicit-fallthrough -Wno-unused-parameter
